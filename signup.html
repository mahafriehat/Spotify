<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spotify | Sign Up</title>

    <link rel="stylesheet" href="style.css">

    <script src="js/validation.js" defer></script>
    <script src="js/auth.js" defer></script>
</head>

<body class="auth-page">

    <main class="auth-card">

        <img src="images/spotify.png" alt="Spotify Logo" class="welcome-logo-img">

        <h1>Sign up to start listening</h1>

        <form id="auth-form" data-mode="signup" novalidate>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email">
            <small class="error" id="email-error"></small>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Create a password"
                autocomplete="new-password">
            <small class="hint">
                At least 8 characters, uppercase, lowercase and one of @ # $ !
            </small>
            <small class="error" id="password-error"></small>

            <label for="confirm-password">Confirm Password</label>
            <input id="confirm-password" name="confirm-password" type="password" placeholder="Enter your password again"
                autocomplete="new-password">
            <small class="error" id="confirm-password-error"></small>

            <button class="btn btn-green" type="submit">
                Sign Up
            </button>

            <p class="form-status" id="form-status" aria-live="polite"></p>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="login.html">Log in</a>
        </p>

    </main>

</body>

</html>
