<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify - Search</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="app-body">

    <div class="main-content">
        <h1 class="page-title">Search</h1>


        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Artists, songs, or podcasts">
        </div>

        
        <h2 class="section-title">Your top genres</h2>
        <div class="genre-grid">
            <div class="genre-card" style="background-color: #8c67ab;">Pop</div>
            <div class="genre-card" style="background-color: #99203b;">Bollywood</div>
        </div>

       
        <h2 class="section-title">Browse all</h2>
        <div class="genre-grid">
            <div class="genre-card" style="background-color: #e13300;">Podcasts</div>
            <div class="genre-card" style="background-color: #e8115b;">New Releases</div>
            <div class="genre-card" style="background-color: #8d67ab;">Charts</div>
            <div class="genre-card" style="background-color: #1e3264;">Concerts</div>
            <div class="genre-card" style="background-color: #1e3264;">Made for You</div>
            <div class="genre-card" style="background-color: #477d95;">At Home</div>
        </div>
    </div>

    
    <div class="bottom-nav">
        <div class="nav-item" onclick="window.location.href='home.html'"><i class="fa-solid fa-house"></i><br>Home</div>
        <div class="nav-item active"><i class="fa-solid fa-magnifying-glass"></i><br>Search</div>
        <div class="nav-item"><i class="fa-solid fa-book-open"></i><br>Your Library</div>
        <div class="nav-item"><i class="fa-brands fa-spotify"></i><br>Premium</div>
    </div>

</body>

</html>
