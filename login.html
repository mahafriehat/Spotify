<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Spotify | Log in</title>
        <link rel="stylesheet" href="style.css">
        <script src="js/validation.js" defer></script>
        <script src="js/auth.js" defer></script>
    </head>
<body class="auth-page">
    <main class="auth-card">
        <img src="images/spotify.png" alt="Spotify Logo" class="welcome-logo-img">
        <h1>Millions of songs<br>Free on Spotify.</h1>
        <form id="auth-form" data-mode="login" novalidate>
            <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email">
            <small class="error" id="email-error"></small>
            <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password">
            <small class="error" id="password-error"></small>
            <a class="forgot-link" href="#" id="forgot-link">Forgot password?</a>
            <button class="btn btn-green" type="submit">Login</button>
            <p class="form-status" id="form-status" aria-live="polite"></p>
        </form>
        <p class="auth-switch">Don't have an account? <a>Sign Up</a>
        </p>
    </main>
</body>
</html>
