<!doctype html>
<html lang="en">
    <head><meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Spotify | Now Playing</title>
        <link rel="stylesheet" href="style.css">
        <script src="js/data.js" defer></script>
        <script src="js/routes.js" defer></script>
        <script src="js/player.js" defer></script>
    </head>
<body class="player-page">
    <main class="player-shell">
        <header class="player-top">
            <a href="playlist.html" aria-label="Back to playlist">⌄</a>
            <div><small>PLAYING FROM PLAYLIST</small>
                <strong>STAY (with Justin Bieber)</strong>
            </div>
            <button class="icon-btn" aria-label="More options">⋮</button>
        </header>
        <img src="images/stay.jpg" alt="Album artwork">
        <section class="now-playing">
            <div>
                <h1 id="player-title">STAY (with Justin Bieber)</h1>
                <p id="player-artist">The Kid LAROI, Justin Bieber</p>
            </div>
            <button id="like-track" class="like-btn" aria-label="Like song">♡</button>
        </section>
        <div class="progress-wrap">
            <input id="progress" type="range" min="0" max="100" value="0" aria-label="Track progress">
            <div class="time-row">
                <span id="current-time">0:00</span>
                <span id="duration">0:30</span>
            </div>
        </div>
        <div class="player-controls">
            <button id="shuffle" aria-label="Shuffle">⤨</button>
            <button id="previous" aria-label="Previous">|◀</button>
            <button id="play-pause" class="play-pause" aria-label="Play">▶</button>
            <button id="next" aria-label="Next">▶|</button>
            <button id="repeat" aria-label="Repeat">⟳</button>
        </div>
        <audio id="audio" preload="metadata" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>
    </main>
</body>
</html>
